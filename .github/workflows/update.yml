name: update-data

# 时区约定（务必保留注释）
# ---------------------------------------------------------------
# GitHub Actions 的 schedule **只支持 UTC**，没有 `timezone:` 字段可用，
# 因此触发时间只能手动换算：北京时间 = UTC + 8。
#   UTC 07:40 = 北京 15:40（收盘后 40 分钟，收盘价与成交额已定稿）
#   UTC 11:30 = 北京 19:30（晚间主更新，可捕获 T+1 发布的两融）
# 注意：`cron` 决定**何时跑**，不决定「数据属于哪个交易日」——后者由
# scripts/build.py 的 last_closed_trade_date() 用北京时间（UTC+8）判定，
# 且只有「目标日 == 最近已收盘交易日」才允许抓实时 spot。
# 另有 TZ=Asia/Shanghai 供 `date` 等 shell 命令使用（runner 默认 UTC）。
# ---------------------------------------------------------------
on:
  schedule:
    # UTC 07:40 = 北京时间 15:40：收盘后增量
    - cron: '40 7 * * 1-5'
    # UTC 11:30 = 北京时间 19:30：晚间全量增量
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '云端序列回补天数（0=只跑增量；>0 回补最近 N 个交易日，本地受限时的云端通道）'
        required: false
        default: '0'

concurrency:
  group: update-data
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai      # shell 层（date/git log）统一北京时区

jobs:
  verify-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r scripts/requirements.txt
      - name: Verify independent data sources
        run: python scripts/verify_data_sources.py
      - name: Upload verify report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-data-sources-report
          path: scripts/_cache/verify_data_sources_report.json

  build:
    # 门禁真正生效：verify-sources 判定 CI 可用指数源全挂时失败，build 不再照跑
    needs: verify-sources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      # 回归测试：行情接口失败路径不得再触发未定义函数错误（如 notify_failure NameError）
      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -q

      # 全市场数据管线：单日失败自动保留旧数据并 exit 0，不会中断后续步骤
      - name: Build data (incremental)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SC_SENDKEY: ${{ secrets.SC_SENDKEY }}
        run: |
          BF="${{ github.event.inputs.backfill_days }}"
          if [ -n "$BF" ] && [ "$BF" != "0" ]; then
            echo "云端序列回补：最近 $BF 个交易日"
            python scripts/build.py --incremental --backfill-days "$BF" || true
          fi
          python scripts/build.py --incremental

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            # TZ=Asia/Shanghai：提交信息里的日期是北京时间的交易日，不是 UTC 日期
            git commit -m "data: update $(date +%F) $(TZ=Asia/Shanghai date +%H:%M) CST"
            git push
          fi
