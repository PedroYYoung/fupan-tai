name: update-data

on:
  schedule:
    # UTC 07:00 = 北京时间 15:00（收盘）：更新自选股行情 quotes.json
    - cron: '0 7 * * 1-5'
    # UTC 11:30 = 北京时间 19:30（收盘后）：全量增量数据 + 自选股行情兜底
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '云端序列回补天数（0=只跑增量；>0 回补最近 N 个交易日，本地受限时的云端通道）'
        required: false
        default: '0'

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  verify-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r scripts/requirements.txt
      - name: Verify independent data sources
        run: python scripts/verify_data_sources.py
      - name: Upload verify report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-data-sources-report
          path: scripts/_cache/verify_data_sources_report.json

  build:
    # 门禁真正生效：verify-sources 判定 CI 可用指数源全挂时失败，build 不再照跑
    needs: verify-sources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      # 回归测试：行情接口失败路径不得再触发未定义函数错误（如 notify_failure NameError）
      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -q

      # 全市场数据管线：单日失败自动保留旧数据并 exit 0，不会中断后续步骤
      - name: Build data (incremental)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SC_SENDKEY: ${{ secrets.SC_SENDKEY }}
        run: |
          BF="${{ github.event.inputs.backfill_days }}"
          if [ -n "$BF" ] && [ "$BF" != "0" ]; then
            echo "云端序列回补：最近 $BF 个交易日"
            python scripts/build.py --incremental --backfill-days "$BF" || true
          fi
          python scripts/build.py --incremental

      # 自选股行情（quotes.json）：读取 public/data/stocks.json 清单
      - name: Update quotes
        run: python scripts/update_data.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update $(date -u +%F)"
            git push
          fi
