name: update-data

on:
  schedule:
    # UTC 07:00 = 北京时间 15:00（收盘）：更新自选股行情 quotes.json
    - cron: '0 7 * * 1-5'
    # UTC 11:30 = 北京时间 19:30（收盘后）：全量增量数据 + 自选股行情兜底
    - cron: '30 11 * * *'
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      # 全市场数据管线：单日失败自动保留旧数据并 exit 0，不会中断后续步骤
      - name: Build data (incremental)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SC_SENDKEY: ${{ secrets.SC_SENDKEY }}
        run: python scripts/build.py --incremental

      # 自选股行情（quotes.json）：读取 public/data/stocks.json 清单
      - name: Update quotes
        run: python scripts/update_data.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update $(date -u +%F)"
            git push
          fi
