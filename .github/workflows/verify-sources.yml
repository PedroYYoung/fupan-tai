name: verify-sources

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/verify-sources.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Run pytest
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Verify independent data sources
        run: python scripts/verify_data_sources.py

      - name: Print verify report
        if: always()
        run: cat scripts/_cache/verify_data_sources_report.json || true

      - name: Upload verify report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-data-sources-report
          path: scripts/_cache/verify_data_sources_report.json
